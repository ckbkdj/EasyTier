name: Publish OpenWrt IPv6 UDP Fix - aarch64

on:
  push:
    branches:
      - fix/ipv6-udp-reply-source
    paths:
      - .github/workflows/publish-openwrt-ipv6fix-aarch64.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: aarch64-unknown-linux-musl
  RELEASE_TAG: v2.6.4-openwrt-ipv6fix.1

jobs:
  build-and-release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/ipv6-udp-reply-source
          fetch-depth: 0

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: aarch64-unknown-linux-musl
          gui: false
          pnpm: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "openwrt-ipv6fix"
          shared-key: "aarch64-musl"
          cache-targets: "false"

      - name: Build embedded web console
        run: |
          cargo build --release --target "$TARGET" --package=easytier-web --features=embed
          cp "target/$TARGET/release/easytier-web" "target/$TARGET/release/easytier-web-embed"

      - name: Build EasyTier binaries
        run: |
          cargo build --release --target "$TARGET" --features=jemalloc

      - name: Package OpenWrt-compatible archive
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/easytier-core" dist/package/
          cp "target/$TARGET/release/easytier-cli" dist/package/
          cp "target/$TARGET/release/easytier-web" dist/package/ || true
          cp "target/$TARGET/release/easytier-web-embed" dist/package/
          chmod 0755 dist/package/easytier-*
          (cd dist/package && zip -9 "../easytier-linux-aarch64-${RELEASE_TAG}.zip" easytier-core easytier-cli easytier-web easytier-web-embed)
          sha256sum "dist/easytier-linux-aarch64-${RELEASE_TAG}.zip" > "dist/easytier-linux-aarch64-${RELEASE_TAG}.zip.sha256"
          file dist/package/easytier-core
          ./dist/package/easytier-core --version

      - name: Publish fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: fix/ipv6-udp-reply-source
          name: EasyTier v2.6.4 OpenWrt IPv6 UDP Fix 1
          prerelease: true
          body: |
            OpenWrt aarch64 test release based on EasyTier v2.6.4.

            Fixes wildcard IPv6 UDP listener replies choosing a different local IPv6 source address than the address that received the packet. This affects UDP/WireGuard handshakes on multi-address OpenWrt routers.

            Source fix branch: `fix/ipv6-udp-reply-source`
          files: |
            dist/easytier-linux-aarch64-${{ env.RELEASE_TAG }}.zip
            dist/easytier-linux-aarch64-${{ env.RELEASE_TAG }}.zip.sha256
