name: Patch netfix Clippy allowance

on:
  push:
    branches:
      - fix/ipv6-udp-reply-source
    paths:
      - .github/workflows/patch-netfix-clippy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ipv6-udp-reply-source
          fetch-depth: 0

      - name: Allow metadata-expanded mux accept helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('easytier-core/src/socket/udp/layer.rs')
          text = path.read_text()
          old = 'pub(super) fn handle_new_easy_tier_mux_connect<S>(\n'
          new = '#[allow(clippy::too_many_arguments)]\npub(super) fn handle_new_easy_tier_mux_connect<S>(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one mux helper, found {text.count(old)}')
          if new in text:
              raise SystemExit('allowance already present')
          path.write_text(text.replace(old, new))

      - name: Commit Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add easytier-core/src/socket/udp/layer.rs
          git diff --cached --check
          git commit -m 'fix: allow metadata-expanded UDP mux helper'
          git push origin HEAD:fix/ipv6-udp-reply-source
